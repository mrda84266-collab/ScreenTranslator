name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # llama-server را برای arm64 کامپایل می‌کنیم و به شکل libllama_server.so داخل APK می‌گذاریم
      - name: Build llama-server (arm64-v8a)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK"
          cmake -S llama.cpp -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build build-android --config Release -j"$(nproc)" --target llama-server
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build-android/bin/llama-server app/src/main/jniLibs/arm64-v8a/libllama_server.so
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip app/src/main/jniLibs/arm64-v8a/libllama_server.so
          ls -l app/src/main/jniLibs/arm64-v8a/

      # موتور بازی حرفه‌ای Phaser 3 داخل APK گذاشته می‌شود تا عامل بازی را با موتور بسازد، نه با کد خام
      - name: Fetch Phaser engine
        run: |
          mkdir -p app/src/main/assets/engines
          curl -fL https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js -o app/src/main/assets/engines/phaser.min.js || echo "::warning::phaser download failed"
          ls -l app/src/main/assets/engines/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SelfDev-apk
          path: app/build/outputs/apk/debug/app-debug.apk
